name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        working-directory: test
        run: |
          npm install
          npx playwright install --with-deps chromium

      # run.mjs skips the 17 browser suites and still exits 0 when Playwright
      # is missing, which is right on a laptop and wrong here: a green run that
      # covered 3 suites out of 20 is worse than a red one, because it looks
      # like proof. Fail loudly instead.
      - name: Assert Playwright resolved
        working-directory: test
        run: |
          node -e "import('playwright').then(
            () => console.log('playwright present'),
            () => { console.error('Playwright missing — the browser suites would silently skip'); process.exit(1); }
          )"

      - name: Run the suites
        run: |
          node test/run.mjs
          node test/backend/contract-static.test.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
