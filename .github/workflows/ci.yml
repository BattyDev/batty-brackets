name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend permissions and registration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute migrations and permission checks in disposable PostgreSQL
        env:
          PGPASSWORD: disposable-test
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f test/backend/run.sql

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        working-directory: test
        run: |
          npm install
          npx playwright install --with-deps chromium

      # run.mjs skips browser suites and still exits 0 when Playwright
      # is missing, which is right on a laptop and wrong here: a green run that
      # covered only Node suites is worse than a red one, because it looks like
      # proof. Fail loudly instead.
      - name: Assert Playwright resolved
        working-directory: test
        run: |
          node -e "import('playwright').then(
            () => console.log('playwright present'),
            () => { console.error('Playwright missing — the browser suites would silently skip'); process.exit(1); }
          )"

      - name: Run the suites
        run: |
          node test/run.mjs
          node test/backend/contract-static.test.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
