<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batty Brackets · By BattyDev</title>
<meta name="description" content="Tournament brackets for fighting games — built for locals. Runs offline at the venue, bulk import and edit anything, and seeding you can check before you commit.">

<!-- Theme colour is set for both schemes. The app bar is the surface colour,
     so matching it here is what stops the phone's status bar being a bright
     band above a dark page. -->
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131d" media="(prefers-color-scheme: dark)">

<!-- Link preview. Page-level rather than per-event, and that is a real
     limitation rather than an oversight: GitHub Pages serves static files, so
     there is no server to render per-event meta tags, and Discord's crawler
     does not run JavaScript. An event link therefore unfurls as the site.
     See README, "What is not built". -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Batty Brackets">
<meta property="og:title" content="Batty Brackets · By BattyDev">
<meta property="og:description" content="Tournament brackets for fighting games, built for the people running them. Works offline at the venue.">
<meta property="og:url" content="https://battybrackets.com/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://battybrackets.com/">

<!-- The favicon uses the same bracket mark and violet badge as navigation. -->
<link rel="icon" type="image/svg+xml" href="assets/brand/bracket-badge.svg?v=2">

<link rel="stylesheet" href="brackets.css?v=10">
</head>
<body>

<!-- The app renders into here. Everything before it is what a visitor sees if
     JavaScript has not run yet -- which on venue wifi is a real, visible
     moment, so it is not a spinner. It is the name of the thing and a line
     saying what it is, replaced in place once the module loads. -->
<div id="app">
  <div style="min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center">
    <div>
      <p class="label-large" style="color:var(--md-primary);margin:0 0 8px">BattyDev</p>
      <h1 class="publication-wordmark" style="margin-bottom:8px">Batty Brackets<span>.</span></h1>
      <p class="body-medium dim">Loading…</p>
      <noscript>
        <div class="banner banner-warn" style="margin-top:24px;text-align:left;max-width:44ch">
          <div>
            <b>This needs JavaScript.</b>
            <div class="body-small" style="margin-top:4px">
              The whole point of it is that the bracket runs on your device rather than
              on a server, which is not something a static page can do without it.
            </div>
          </div>
        </div>
      </noscript>
    </div>
  </div>
</div>

<!-- Docked chrome that must survive a re-render.

     The guided-tour card lives here rather than inside #app because the router
     replaces the whole of #app on every draw, and anything recreated that way
     replays its entry animation and loses its scroll and focus. For a panel
     that is on screen continuously while somebody reads it, that showed up as
     the card flickering in and out once a second. -->
<div id="chrome"></div>

<!-- Where the current page name is announced after a navigation. It sits
     OUTSIDE #app on purpose: the router replaces the whole of #app on every
     draw, and a live region that is removed and re-added in the same tick is
     not reliably announced by any screen reader. Keeping one stable node and
     only changing its text is what makes the announcement actually fire. -->
<div id="route-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Connection settings, loaded as a classic script so it is a plain global
     the module can read synchronously at boot. Blank by default: the app runs
     entirely on-device until this names a project. -->
<script src="config.js"></script>
<script type="module" src="app.js?v=10"></script>

</body>
</html>
